# ============================================================================
# OBE Informática — Vitrine / E-commerce · Deploy na RAIZ (obeinformatica.com)
# ----------------------------------------------------------------------------
# Serve a loja estática (nginx) e publica via Traefik em:
#   - https://obeinformatica.com        (canônico — a loja)
#   - https://www.obeinformatica.com    (redireciona 301 -> raiz)
#
# 3 nomes dependem deste servidor. Os padrões abaixo (traefik / websecure / le)
# são os mais comuns — se não baterem com o do panel./alumnos., defina como
# variáveis de ambiente na tela do Portainer (Environment variables):
#   TRAEFIK_NETWORK      (rede externa do Traefik)     padrão: traefik
#   TRAEFIK_ENTRYPOINT   (entrypoint HTTPS)            padrão: websecure
#   TRAEFIK_CERTRESOLVER (resolver TLS/Let's Encrypt)  padrão: le
#
# ⚠️ Hoje a RAIZ já é servida por outro container (o login do aluno, igual ao
#    alumnos.). É preciso REMOVER/REPONTAR aquele router com Host(`obeinformatica.com`)
#    — senão dá conflito. O login do aluno continua no alumnos. (não se perde).
# ============================================================================

services:
  obe-loja:
    build: .
    image: obe-loja:latest
    container_name: obe-loja
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"

      # --- Router principal: raiz (canônico) --------------------------------
      - "traefik.http.routers.obe-loja.rule=Host(`obeinformatica.com`)"
      - "traefik.http.routers.obe-loja.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.obe-loja.tls=true"
      - "traefik.http.routers.obe-loja.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}"
      - "traefik.http.services.obe-loja.loadbalancer.server.port=80"

      # --- Router do www: redireciona 301 para a raiz -----------------------
      - "traefik.http.routers.obe-loja-www.rule=Host(`www.obeinformatica.com`)"
      - "traefik.http.routers.obe-loja-www.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.obe-loja-www.tls=true"
      - "traefik.http.routers.obe-loja-www.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}"
      - "traefik.http.routers.obe-loja-www.middlewares=obe-www-redirect"
      - "traefik.http.middlewares.obe-www-redirect.redirectregex.regex=^https?://www\\.obeinformatica\\.com/(.*)"
      - "traefik.http.middlewares.obe-www-redirect.redirectregex.replacement=https://obeinformatica.com/$${1}"
      - "traefik.http.middlewares.obe-www-redirect.redirectregex.permanent=true"

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
