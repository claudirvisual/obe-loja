server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA por hash-routing: no hacen falta rewrites, todo sirve index.html.
    # El shell HTML no se cachea: así cada deploy se ve al instante.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    # Estáticos (js/css/img): se revalidan por ETag. El navegador pregunta al
    # servidor en cada carga; recibe 304 si no cambió (rápido) o el archivo nuevo
    # si cambió (propagación inmediata, sin quedar pegado a una versión vieja).
    location /assets/ {
        access_log off;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;
}
